<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover abilita le safe area (notch, Dynamic Island, home indicator).
         Niente user-scalable=no: lo zoom al focus si evita con input a 16px -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Calories Calculator</title>
    <meta name="description" content="Diario alimentare: calorie e macronutrienti calcolati con l'AI." />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="light dark" />

    <!-- iOS ignora gran parte del manifest: servono i meta Apple -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- black-translucent: il contenuto passa sotto la barra di stato, l'header gestisce la safe area -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Calorie" />

    <!-- Tema applicato prima del primo paint (file esterno: la CSP non ammette script inline) -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
