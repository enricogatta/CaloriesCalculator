# Unico file di configurazione Netlify, usato sia in produzione sia da `netlify dev`
# (da lanciare dalla root del repository). Tutti i percorsi sono relativi a `base`.
[build]
  base = "app"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # URL pubblica, finisce nel bundle di proposito: non è un segreto
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

[functions]
  node_bundler = "esbuild"

# netlify dev esegue il comando dalla root del repo, non da `base`
[dev]
  command = "npm run dev --prefix app"
  framework = "vite"
  targetPort = 5173
  port = 8888

# L'ordine conta: /api/* deve precedere il fallback della SPA
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Header di sicurezza. La Content-Security-Policy è un <meta> aggiunto in build
# da vite.config.js (qui romperebbe l'hot reload di netlify dev).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"

# File con hash nel nome: non cambiano mai, cache permanente
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
